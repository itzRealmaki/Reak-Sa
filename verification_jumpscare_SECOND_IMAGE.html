<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verification Portal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#0f172a;color:#fff;min-height:100vh}
nav{background:#1e293b;padding:20px 40px;border-bottom:1px solid #334155}
.logo{color:#38bdf8;font-size:20px;font-weight:bold}
.container{min-height:calc(100vh - 65px);display:flex;justify-content:center;align-items:center;padding:30px 15px}
.card{width:100%;max-width:600px;background:#1e293b;padding:30px;border-radius:12px;border:1px solid #334155}
.subtitle{color:#94a3b8;margin:8px 0 25px}
.group{margin-bottom:17px}
label{display:block;margin-bottom:7px;color:#cbd5e1}
input{width:100%;padding:13px;background:#0f172a;border:1px solid #475569;border-radius:7px;color:#fff;font-size:16px}
button[type=submit]{width:100%;padding:14px;background:#0284c7;border:0;border-radius:7px;color:#fff;font-size:17px;font-weight:bold}
#result{display:none;margin-top:20px;padding:15px;border-radius:7px}
.good{background:#052e16;border:1px solid #22c55e;color:#4ade80}
.bad{background:#450a0a;border:1px solid #ef4444;color:#f87171}
.cookie{position:fixed;bottom:0;left:0;width:100%;background:#1e293b;border-top:1px solid #334155;padding:20px;display:flex;justify-content:space-between;align-items:center}
.cookie button{padding:9px 16px;border:0;border-radius:6px;margin-left:8px;font-weight:bold}
.accept{background:#22c55e}.decline{background:#475569;color:#fff}
#scare{display:none;position:fixed;inset:0;background:#000;z-index:99999;align-items:center;justify-content:center}
#scare img{width:100%;height:100%;object-fit:contain;opacity:0}
#scare.active img{opacity:1;animation:shake .45s linear}
@keyframes shake{0%{transform:scale(1.05)}20%{transform:scale(1.05) translate(-15px,8px)}40%{transform:scale(1.05) translate(13px,-8px)}60%{transform:scale(1.05) translate(-12px,7px)}80%{transform:scale(1.05) translate(8px,-4px)}100%{transform:scale(1.05)}}
@media(max-width:600px){nav{padding:18px 20px}.card{padding:24px}.cookie{flex-direction:column;gap:12px;align-items:stretch}}
</style>
</head>
<body>

<div id="portal">
<nav><div class="logo">AccessPortal</div></nav>
<div class="container">
<div class="card">
<h2>User Verification</h2>
<p class="subtitle">Please complete the form below to proceed.</p>
<form id="verifyForm">
<div class="group"><label>Full Name</label><input id="name" type="text" required></div>
<div class="group"><label>Age</label><input id="age" type="number" min="1" max="120" required></div>
<div class="group"><label>Height (cm)</label><input id="height" type="number" step="0.1" required></div>
<div class="group"><label>Weight (kg)</label><input id="weight" type="number" step="0.1" required></div>
<button type="submit">Verify Entry</button>
</form>
<div id="result"></div>
</div>
</div>

<div class="cookie" id="cookie">
<span>We use cookies to improve your user experience.</span>
<div>
<button class="accept" onclick="hideCookie()">Accept All</button>
<button class="decline" onclick="hideCookie()">Decline</button>
</div>
</div>
</div>

function scarySound(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    const a=new AC();
    const now=a.currentTime;

    const o=a.createOscillator(),g=a.createGain();
    o.type="sawtooth";
    o.frequency.setValueAtTime(90,now);
    o.frequency.exponentialRampToValueAtTime(40,now+.8);
    g.gain.setValueAtTime(.001,now);
    g.gain.exponentialRampToValueAtTime(.3,now+.03);
    g.gain.exponentialRampToValueAtTime(.001,now+.9);
    o.connect(g);g.connect(a.destination);
    o.start(now);o.stop(now+.9);

    const o2=a.createOscillator(),g2=a.createGain();
    o2.type="square";
    o2.frequency.setValueAtTime(700,now);
    o2.frequency.exponentialRampToValueAtTime(1800,now+.12);
    o2.frequency.exponentialRampToValueAtTime(500,now+.7);
    g2.gain.setValueAtTime(.001,now);
    g2.gain.exponentialRampToValueAtTime(.18,now+.02);
    g2.gain.exponentialRampToValueAtTime(.001,now+.7);
    o2.connect(g2);g2.connect(a.destination);
    o2.start(now);o2.stop(now+.75);
  }catch(e){}
}

      document.getElementById("portal").style.display="none";
      const scare=document.getElementById("scare");
      scare.style.display="flex";

      setTimeout(function(){
        scarySound();
        scare.classList.add("active");
      },500);
    },1000);
  }else{
    result.className="bad";
    result.textContent="Status: Access Denied. You must be 18+.";
    result.style.display="block";
  }
});
</script>
